<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>BMI Calculator</h1>
    <form id="bmi-form">
        <label for="weight">Weight (kg):</label>
        <input type="number" id="weight" required placeholder="e.g., 70" min="0.1" step="0.1">
        <br>
        <label for="height">Height (m):</label>
        <input type="number" id="height" step="0.01" required placeholder="e.g., 1.75" min="0.1">
        <br>
        <button type="submit" id="calculate-button" class="button">Calculate BMI</button>
        
    </form>
     <h2 id="result">
        Your BMI will be displayed here.
    </h2>
   
    <script src="script.js"></script>
</body>
</html>
